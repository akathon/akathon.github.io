<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/logo.png">
    <title>Akathon Registration Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .form-section {
            padding: 20px;
        }

        .form-container {
            position: relative;
            width: 100%;
            padding-bottom: 150%; /* Adjust height as needed */
            height: 0;
            overflow: hidden;
        }

        .form-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #f1f5f9;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }

            .container {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Akathon Registration</h1>
            <p>Join the community and start building real-world tech skills today.</p>
        </div>

        <div class="form-section">
            <div class="form-container">
               <iframe 
                    src="https://docs.google.com/forms/d/e/1FAIpQLSfRey4_QutDN69KNGxtU9fH7PKMyoQNjjH1xzn_5P_4M_V0Mg/viewform?embedded=true"
                    width="100%"
                    height="800"
                    frameborder="0"
                    marginheight="0"
                    marginwidth="0"
                    allowfullscreen>
                    Loading…
                </iframe>
        </div>

        <div class="footer">
            © 2026 Akathon Programming Community | All Rights Reserved
        </div>
    </div>

</body>
</html>
